<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FAF8F2" />
    <title>The Southern Curations</title>
    <script>
      (function () {
        var zh = /(?:^|\/)zh(?:\/|$)/.test(location.pathname);
        if (zh) {
          document.documentElement.lang = "zh-Hans";
          document.title = "南境拾遗";
        }
      })();
    </script>
    <style>
      html,body{margin:0;background:#FAF8F2}
      #root{min-height:100svh}
      :root{--paper:#FAF8F2;--sk:#D5D5D3;--sk-2:#E4E4E2;--line:#D9D6CC}
      .sk{background:var(--sk);border-radius:8px}
      .sk-round{border-radius:999px}
      @media (prefers-reduced-motion: no-preference){
        .sk,.sk-card-img{animation:sk 1.6s ease-in-out infinite}
        @keyframes sk{50%{opacity:.78}}
      }
      #sk-page{background:var(--paper);min-height:100svh;padding-bottom:72px}
      #sk-header-m,#sk-header-d{position:fixed;top:0;left:0;right:0;z-index:2}
      #sk-header-m{height:52px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 12px}
      #sk-header-d{display:none;height:60px}
      #sk-hero{min-height:100svh;background:var(--sk-2);display:flex;flex-direction:column;justify-content:flex-end;padding:0 16px calc(96px + env(safe-area-inset-bottom))}
      #sk-hero-copy{max-width:640px;padding-bottom:14px}
      #sk-tours{max-width:1060px;margin:0 auto;padding:48px 16px 24px;display:grid;gap:20px}
      .sk-card{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#FDFBF6}
      .sk-card-img{height:160px;background:var(--sk)}
      .sk-card-body{padding:16px}
      #sk-days{max-width:1060px;margin:0 auto;padding:8px 16px 32px}
      .sk-tabs{display:flex;border-bottom:1px solid var(--line);margin-bottom:12px}
      .sk-tab{height:44px;flex:1}
      .sk-day{height:56px;border-radius:8px;margin-bottom:8px}
      #sk-dock{position:fixed;left:0;right:0;bottom:0;z-index:2;height:calc(56px + env(safe-area-inset-bottom));background:#FDFBF6;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
      #sk-dock span{flex:1;margin:10px 12px;height:36px;border-radius:8px;background:var(--sk)}
      @media (min-width:768px){
        #sk-header-m{display:none}
        #sk-header-d{display:flex;align-items:center;max-width:1060px;margin:0 auto;padding:0 32px}
        #sk-hero{padding:0 32px 56px}
        #sk-tours{grid-template-columns:1fr 1fr;padding:64px 32px 32px}
        .sk-card-img{height:200px}
        #sk-days{padding:8px 32px 48px}
        #sk-dock{display:none}
        #sk-page{padding-bottom:0}
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="sk-page" aria-hidden="true">
        <header id="sk-header-m">
          <div class="sk sk-round" style="width:28px;height:28px"></div>
          <div class="sk" style="width:88px;height:22px"></div>
          <div style="display:flex;justify-content:flex-end">
            <div class="sk sk-round" style="width:28px;height:28px"></div>
          </div>
        </header>
        <header id="sk-header-d">
          <div class="sk" style="width:96px;height:22px"></div>
          <div style="display:flex;flex:1;justify-content:center;gap:28px;align-items:center">
            <div class="sk" style="width:44px;height:12px"></div>
            <div class="sk" style="width:44px;height:12px"></div>
            <div class="sk" style="width:44px;height:12px"></div>
            <div class="sk" style="width:44px;height:12px"></div>
          </div>
          <div style="display:flex;justify-content:flex-end;gap:8px;width:96px">
            <div class="sk sk-round" style="width:28px;height:28px"></div>
            <div class="sk sk-round" style="width:28px;height:28px"></div>
          </div>
        </header>
        <section id="sk-hero">
          <div id="sk-hero-copy">
            <div class="sk sk-round" style="width:96px;height:22px"></div>
            <div class="sk" style="width:86%;height:36px;margin-top:18px"></div>
            <div class="sk" style="width:62%;height:36px;margin-top:10px"></div>
            <div class="sk" style="width:78%;height:14px;margin-top:16px"></div>
            <div class="sk" style="width:54%;height:14px;margin-top:8px"></div>
            <div style="display:flex;gap:12px;margin-top:28px">
              <div class="sk" style="width:148px;height:48px"></div>
              <div class="sk" style="width:168px;height:48px"></div>
            </div>
            <div style="display:flex;gap:6px;margin-top:32px">
              <div class="sk sk-round" style="width:32px;height:4px"></div>
              <div class="sk sk-round" style="width:6px;height:4px"></div>
              <div class="sk sk-round" style="width:6px;height:4px"></div>
              <div class="sk sk-round" style="width:6px;height:4px"></div>
            </div>
          </div>
        </section>
        <section id="sk-tours">
          <div class="sk-card">
            <div class="sk-card-img"></div>
            <div class="sk-card-body">
              <div class="sk" style="width:72px;height:12px"></div>
              <div class="sk" style="width:70%;height:20px;margin-top:12px"></div>
              <div class="sk" style="width:90%;height:12px;margin-top:10px"></div>
              <div class="sk" style="width:56%;height:12px;margin-top:8px"></div>
            </div>
          </div>
          <div class="sk-card">
            <div class="sk-card-img"></div>
            <div class="sk-card-body">
              <div class="sk" style="width:72px;height:12px"></div>
              <div class="sk" style="width:64%;height:20px;margin-top:12px"></div>
              <div class="sk" style="width:88%;height:12px;margin-top:10px"></div>
              <div class="sk" style="width:50%;height:12px;margin-top:8px"></div>
            </div>
          </div>
        </section>
        <section id="sk-days">
          <div class="sk-tabs">
            <div class="sk-tab" style="border-bottom:2px solid var(--sk)"></div>
            <div class="sk-tab"></div>
          </div>
          <div class="sk sk-day"></div>
          <div class="sk sk-day"></div>
          <div class="sk sk-day"></div>
          <div class="sk sk-day"></div>
        </section>
        <nav id="sk-dock"><span></span><span></span></nav>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
