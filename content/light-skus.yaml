  - id: embroidered-ball
    category: village
    kind: route
    status: live
    sort: 120
    title:
      en: Make a Zhuang Embroidered Ball
      zh: 绣球里的山水心意
    blurb:
      - en: Sit with a Zhuang auntie and stitch Guangxi’s iconic embroidered ball — a compact piece of intangible heritage held in the palm.
        zh: 跟着壮族阿嫂亲手制作广西的瑰宝——绣球，学习传统针法，感受少数民族非遗如何落在指尖。
      - en: "A small ball carries big wishes: courtship, blessing, and the warmth of wanting a good life for the people you love."
        zh: 小小绣球寓意很深：寄托情意与祝福，也装着人们对美好生活的热情。
    images:
