  - id: dong-song
    category: village
    kind: route
    status: live
    sort: 130
    title:
      en: Dong Grand Song Gathering
      zh: 侗族大歌 · 无指挥的自然和声
    blurb:
      - en: "Meet a heritage Dong song troupe face to face: many voices, no conductor, no accompaniment, no score — birdsong and mountain water folded into harmony."
        zh: 与侗族大歌传承歌班面对面：多声部、无指挥、无伴奏、无曲谱，把鸟叫虫鸣、高山流水织进和声。
      - en: Open that sonic world with them and feel how close Dong music sits to the natural soundscape of the hills.
        zh: 打开侗族大歌的奇幻魔盒，感受侗族人民对自然界的亲近，以及传统音乐如何在村寨里继续生长。
