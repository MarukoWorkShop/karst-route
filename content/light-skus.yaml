  - id: wulong-hike
    category: hike
    kind: route
    status: live
    sort: 10
    title:
      en: Wulongquan Countryside Walk
      zh: 乌龙泉山径 · 田园徒步
    blurb:
      - en: Walk the paths around Wulongquan’s glass fields and karst viewpoints — the same countryside frames photographers chase at golden hour.
        zh: 沿乌龙泉玻璃田与喀斯特观景台的山径慢走，把摄影向导眼中的田园风光，一步一步走进展平线。
      - en: "No rush, no bus tour: soft trails, village roofs below, and peaks stacked to the horizon."
        zh: 不赶场、不跟大巴：缓坡小径、脚下村舍，远山一层层叠到天边。
    images:
      - light/hike/hike-1.jpeg
      - light/hike/hike-2.jpeg
      - light/hike/hike-3.jpeg
    price:
      unit: person
      bands:
