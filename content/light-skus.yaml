  - id: oil-tea
    category: village
    kind: route
    status: live
    sort: 110
    title:
      en: One Bitter, Four Fragrant · Oil Tea & Mugwort Ciba
      zh: 一杯苦来四杯香 · 打油茶+艾叶粑粑制作
    blurb:
      - en: Yao oil tea is passed down by village elders who keep the tea customs — often in the family, sometimes across the community.
        zh: 瑶族油茶是桂林村寨里了解和掌握瑶族茶规的长者、寨老会传授给年轻人的习俗相关知识。一般传承为家传，也有社会传承。
      - en: "Includes making minority oil tea on site, trying ethnic dress, and making mugwort ciba (aiye baba). Reference: ¥200 / person (1–3, min 2) · ¥150 / person (4–10)."
        zh: 含现场体验制作少数民族油茶、少数民族服饰体验，以及制作艾叶粑粑。参考报价：1–3 人 200 元/人（2 人起订）· 4–10 人 150 元/人。
    images:
