  - id: raft
    category: hike
    kind: route
    status: live
    sort: 50
    title:
      en: Yulong River Bamboo Raft
      zh: 遇龙河人工竹筏漂流
    blurb:
      - en: From Shiwai Taoyuan in Baisha to Gongnong Bridge by the big banyan — clear shallow water, green banks, bamboo and slow current. A quiet way to see village scenery.
        zh: 遇龙河自白沙世外桃源至大榕树工农桥段，水质清澈、水流缓缓，两岸山峰清秀、翠竹葱郁。乘竹筏随波逐流，是欣赏乡村风光很放松的方式。
      - en: "Trips run about 30–90 minutes from different put-ins. Reference: ¥300 per 2-person raft."
        zh: 出发点和行程约半小时至 1.5 小时不等。参考报价：2 人竹筏 300 元/筏。
    images:
      - light/hike/raft-1.jpeg
      - light/hike/raft-2.jpeg
    price:
      unit: raft
      raftCny: 300
      seats: 2
  - id: bike
    category: hike
    kind: route
    status: live
    sort: 60
    title:
      en: Countryside Bike Loops
      zh: 自行车休闲游
    blurb:
      - en: "Mountain-bike loops are a fast way into Yangshuo’s dramatic countryside. Three favourites: Moon Hill (half day), Yulong Bridge (full day, with swim stops), and Liugong Village (800-year riverside hamlet, three-colour ponds)."
        zh: 山地自行车休闲游能在短时间内深入乡野。我们最喜欢的三条：月亮山路线（半天）、遇龙桥路线（全天，沿途可下水）、留公村路线（八百年江边古村，近旁有三色池塘）。
      - en: We share up-to-date route notes so you can ride at your own pace.
        zh: 我们提供最新路线说明，让你按自己的节奏骑完。
    images:
      - light/hike/bike-1.jpeg
      - light/hike/bike-2.jpeg
    price:
      unit: person
      bands:
        - max: 3
          cny: 150
        - max: 10
          cny: 120
        - max: 99
          cny: 120
  - id: climb
    category: hike
    kind: route
    status: live
