  - id: scooter
    category: hike
    kind: route
    status: live
    sort: 30
    title:
      en: Vintage Scooter on the Yulong Path
      zh: 复古机车 · 遇龙河步道
    blurb:
      - en: Ride sidecar and vintage scooters along the Yulong River promenade — rice fields on both sides, karst peaks all around.
        zh: 挎斗机车骑行遇龙河网红步道：水稻田边蜿蜒乡路，喀斯特峰丛环绕的广阔田园。
      - en: Pause at Shuangliu ferry pavilion for a popsicle, splash at the weir, and take the photos the valley asks for.
        zh: 双流义渡亭歇凉吃根老冰棍，堤坝上玩水嬉戏，在山水之间拍美美照、释放活力。
