  - id: xingping-peaks
    category: hike
    kind: route
    status: live
    sort: 90
    title:
      en: Xingping Peak Walks
      zh: 兴坪登山 · 老寨山 / 相公山
    blurb:
      - en: "Laosai Hill by Xingping’s old street and Rongshu pool: ~200 m stone path, a classic photo overlook of the Li’s 180° bend."
        zh: 老寨山位于兴坪古镇老街头漓江榕树潭码头边，高约 200 余米，石径通顶，是观赏兴坪山水、尽览漓江大拐弯的经典摄影点。
      - en: Xianggong Hill on the west bank between Yellow Cloth Shoal and Nine-Horse Fresco — cloud seas, sunrise and ordered peaks for photographers.
        zh: 相公山在漓江西岸、黄布滩与九马画山之间：登顶远眺群峰有序、江流蜿蜒，光影云海与日出彩霞常吸引摄影人。
