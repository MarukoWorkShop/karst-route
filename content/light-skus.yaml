    title:
      en: Rock Climbing
      zh: 攀岩
    blurb:
      - en: Yangshuo is a climbing hub with peaks for every level — gradient sport routes A/B/C/D-Plus and harder natural walls. Beginners and specialists both have options.
        zh: 阳朔正迅速成为亚洲攀岩领域的圣地。山峰多样，不同水准都可锻炼；我们拥有 A/B/C/D-Plus 多条梯度线路，还有高难度自然岩壁可供选择。
      - en: "Reference: ¥350 / person (1–3) · ¥300 / person (4–10) · about 2 hours."
        zh: 参考报价：1–3 人 350 元/人 · 4–10 人 300 元/人 · 约 2 小时。
