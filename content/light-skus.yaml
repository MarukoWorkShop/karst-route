          cny: 180
        - max: 10
          cny: 150
        - max: 99
          cny: 150
  - id: creek
    category: hike
    kind: route
    status: live
    sort: 20
    title:
      en: Valley Creek Tracing
      zh: 山谷溯溪 · 碧潭戏水
    blurb:
      - en: With outdoor coaches, climb rock, ford shallows and follow the stream upstream to jelly-clear swimming pools in a green gorge.
        zh: 在专业户外教练带领下开启山谷溯溪：攀岩趟滩、逆流而上，找到泉水清凉的果冻碧潭。
      - en: Jump, swim and ride natural water slides in the shade — playful and challenging, cool underfoot like early autumn.
        zh: 阴凉处跳潭游泳，还能玩天然水上滑梯：既好玩又有挑战，脚下凉意恍如初秋。
    images:
