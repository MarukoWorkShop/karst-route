  - id: yao-visit
    category: village
    kind: route
    status: live
    sort: 100
    title:
      en: Hong Yao Homestay Visit
      zh: 红瑶人家 · 山歌唱进家门
    blurb:
      - en: Stilt houses still cling to the valley sides, and farming ways that look ancient are simply how people live here. Yao hosts meet you with mountain songs and walk you into their story.
        zh: 依山而建的吊脚楼仍在，刀耕火种的农耕文明也并未变成展陈——瑶族阿嫂阿哥唱着山歌迎你进门，把红瑶人家的故事讲给你听。
      - en: "It is a rare, sincere exchange: not a staged show, but a living household in the gorge offering a memory you can only get by sitting down with them."
        zh: 这是遗落在峡谷里的真诚邀约：不是舞台表演，而是与当地人真正坐在一起，带走一份只能在这里发生的记忆。
    images:
      - light/village/yao-visit-1.jpeg
      - light/village/yao-visit-2.jpeg
      - light/village/yao-visit-3.jpeg
    price:
      unit: person
      bands:
