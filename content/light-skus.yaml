  - id: atv
    category: hike
    kind: route
    status: live
    sort: 40
    title:
      en: ATV Jungle Off-Road
      zh: ATV 丛林越野车
    blurb:
      - en: "Beside a Li River tributary on the Jinbao riverside track: undeveloped scenery, a winding 5 km course through peak forest — speed and karst views together."
        zh: 在漓江支流遇龙河 / 金宝河边：依山临水、景色零开发；5 公里赛道宽阔曲折，穿梭峰林之间，速度与山水美景同时拥有。
      - en: "Reference price: ¥200 / person · two per vehicle · about 50 minutes driving."
        zh: 参考报价：200 元/人（2 人一车）· 驾驶约 50 分钟。
