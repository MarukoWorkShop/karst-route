  - id: home-visit
    category: village
    kind: route
    status: live
    sort: 150
    title:
      en: Local Family Homestay Visit
      zh: 探访当地家访
    blurb:
      - en: "A drive to a countryside home: by season you may plant or harvest rice, or pick fruit. An English-speaking local guide explains rural life around Yangshuo — rice, citrus, pomelo, sugarcane, vegetables, and water buffalo in the fields."
        zh: 您将乘车到达乡下的一个当地家庭；按季节可以看到或帮助种植、收割水稻，或进行水果采摘。会讲英语的当地导游会介绍阳朔周围的农村生活——人们种植水稻、柑橘、柚子、甘蔗、蔬菜，耕作中常使用水牛。
      - en: "Share a simple lunch with the family and learn local ciba, tofu or bamboo weaving. Timing is flexible. Reference: ¥250 / person (1–3, min 2) · ¥200 / person (4–10)."
        zh: 与家庭成员共享简单午餐，学习制作当地糍粑、豆腐或竹编。时间灵活。参考报价：1–3 人 250 元/人（2 人起订）· 4–10 人 200 元/人。
