      zh: 三月三歌圩
    blurb:
      - en: Zhuang song festival on the lunar March third — five-colour sticky rice, dyed eggs, song sheds on the village green. Gatherings last two or three days; large fairs draw thousands.
        zh: 农历三月三又称三月三歌节或三月歌圩，是壮族传统歌节。家家户户做五色糯饭、染彩蛋；歌棚搭在村旁空地，对歌以未婚青年为主，小圩一两千人，大圩可达数万。
