  - id: stilt-tea
    category: village
    kind: route
    status: live
    sort: 140
    title:
      en: Tea in a Restored Stilt Granary
      zh: 吊脚楼粮仓 · 一席老茶
    blurb:
      - en: A host walks you through a stilt-house granary’s second life — from ruin to loft garden, packed with carefully kept antiques.
        zh: 主理人带你走进一座吊脚楼粮仓的故事：从破旧不堪到阁楼花园，满屋精心收藏的老物件。
      - en: "Warmth and persistence, timber tradition meeting present-day living — then a quiet VIP tea table: pitched-pot games, whisked tea, unhurried talk."
        zh: 温情与坚守，传统木构与现代生活交错。再入一席 VIP 茶室：投壶、点茶，把时间放慢。
