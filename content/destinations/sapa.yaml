# 目的地详情 · sapa
# 每日详情「体验 / 餐饮 / 住宿」与 culture 兜底介绍
# photo / hotel_photo / slides 只写 public 下相对路径

src: zh
tagline:
  en: Terraces and Cat Cat
  zh: 梯田与猫猫村
photo: destinations/sapa.jpg
experience:
  title:
    en: Walk the terraces, not just the viewpoint
    zh: 走进梯田，不只是观景台
  body:
    en: The terraces of Muong Hoa are not scenery — they are a water system carved by Hmong and Dao families over centuries, and they only make sense from the inside. We walk down into them instead of photographing from the road, passing Cat Cat village where indigo still stains the hands of women who weave and sell on the same threshold. When the mist comes, the valley disappears and the rice steps fade in and out like a drawing being erased and redrawn.
    zh: 芒花谷的梯田不是风景，是苗族和瑶族人家几百年刻出来的水系，只有走进去才看得懂。我们不下车拍照，而是走下去，穿过猫猫村——染缸里的靛蓝还染着织布女人的手，她们在自家门槛上织，也在自家门槛上卖。起雾的时候，山谷自己会变戏法：梯田一层层消失又浮现，像有人把画擦掉重画。
cuisine:
  title:
    en: Mountain herbs, hot pot
    zh: 山间热锅
  body:
    en: "Sapa's cold is answered with a pot on the table: local herbs, mountain pork, river fish, greens cut that morning. The broth runs sour and herbal rather than fiery — highland cooking built for damp evenings."
    zh: 沙坝的冷是用桌上一口锅来答的：山里的香草、土猪、河鱼，配当天早上摘的青菜。汤头是酸的、带草香，不靠辣——高原的菜，本来就是为潮湿的夜晚准备的。
hotel:
  title:
    en: Terrace-facing lodge
    zh: 看田的山居
  body:
    en: A lodge facing the valley, terraces outside the window at breakfast. Mornings are the point here — the mist lifts off the rice around seven.
    zh: 对着山谷的山居，吃早饭时梯田就在窗外。这里的清晨才是正事——七点左右，雾从稻子上抬起来。
  photo: destinations/hotel-b.jpg
culture:
  en: Sapa's terraces are not a viewpoint — they are a water system, hand-cut over centuries by Hmong and Dao families. We walk down into them with someone who farms there, because the rice tells different things at ankle height than at shoulder height.
  zh: 沙坝的梯田不是观景台——它是水系，是苗族和瑶族几代人用手刻出来的。我们跟在地里干活的本地人走下去，因为稻子在脚踝和肩膀的高度，说的是不同的故事。
