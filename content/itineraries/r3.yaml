  - day: 6
    city:
      en: "Weizhou Island"
      zh: "涠洲岛"
    stay:
      en: "Same cliffside room"
      zh: "同一间悬崖房"
    stayKind: "hotel"
    blurb:
      en: "Crocodile Mountain is the island's volcanic geology at its purest — red-brown lava rock in every shape, white spray where the swell hits. There is a fishing harbour market to walk with the islanders, Nanwan's coast road, and the 2.3 km Blue Bridge reaching straight into a sea the colour of jelly."
      zh: "鳄鱼山是涠洲岛火山地质最纯粹的一段：红褐色火山岩千姿百态，海浪拍打溅起雪白浪花。跟着岛民逛对渔船码头的海鲜市场，走南湾街的海岸公路，还有那条 2.3 公里直通入海的蓝桥，海水蓝绿得像果冻。"
