      zh: "北海"
    stay:
      en: "By Silver Beach"
      zh: "银滩边"
    stayKind: "hotel"
    drive:
      en: "Mingshi → Beihai"
      zh: "明仕赴北海"
    blurb:
      en: "Mingshi is best taken sitting down: a buggy rides past turning peaks, flowing water and rice fields sliding by while farmhouse smoke drifts up. By evening the coast takes over — Silver Beach, and Qiaogang's night market where Vietnamese flavours meet Cantonese seafood."
      zh: "明仕田园最适合坐着看：观光车慢行，窗外山在转、水在流，成片稻田从身旁滑过，农舍炊烟慢慢升上天。傍晚交给海岸——银滩，还有侨港美食街，越南风味与广式海鲜在这里相遇。"
    photos:
