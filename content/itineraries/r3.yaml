  - day: 1
    city:
      en: "Nanning"
      zh: "南宁"
    stay:
      en: "Street food, first night"
      zh: "夜市里的第一夜"
    stayKind: "hotel"
    placeId: "nanning"
    blurb:
      en: "Someone once called Guangxi the most complicated place to eat in China, and Nanning — its capital — is where that complexity becomes street food. The city's warmth hides in its lanes: the sour-savoury smell of pickled fruit, the heat of a wok firing old friend noodles, the sweet hush of a sugar-water stall at dusk."
      zh: "有人说过，广西是中国饮食最复杂的地方。而南宁作为首府，把这份复杂变成了街头滋味。这座城的热情藏在巷弄里：酸嘢的清爽、老友粉的热辣、卷筒粉的软糯、糖水的甜蜜，暮色渐浓时，建政夜市灯火通明、人声鼎沸。"
    transport:
      en: "Airport or station pickup, transfer to the hotel"
      zh: "专车接机／接站，送往酒店"
    lodging:
      en: "Shangri-La Nanning"
      zh: "南宁香格里拉酒店"
    dining:
      - en: "Lunch: not included"
        zh: "午餐：不含"
      - en: "Dinner: Jianzheng night market, at your own pace"
        zh: "晚餐：建政夜市，自行寻觅"
    bullets:
      - en: "Three Streets & Two Lanes, Changyou Pavilion"
        zh: "三街两巷 · 畅游阁"
      - en: "Jianzheng night market"
        zh: "建政夜市"
