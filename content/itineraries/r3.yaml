  - day: 3
    city:
      en: "Chongzuo"
      zh: "崇左"
    stay:
      en: "Same resort, no suitcase"
      zh: "同一度假村，不拎箱子"
    stayKind: "hotel"
    placeId: "chongzuo"
    blurb:
      en: "Detian shares the title of Asia's largest trans-national waterfall with Vietnam's Ban Gioc. The Guichun River breaks over a limestone fault and drops 70 metres in three tiers — on sunny days the spray throws a standing rainbow. Afterwards, coffee inside a natural karst cave right on the border line."
      zh: "德天瀑布与越南板约瀑布共享「亚洲第一大跨国瀑布」之名。归春河在这里冲破喀斯特断层，从 70 米高的崖壁分三级跌落，晴日里水雾中常常挂起一道彩虹。随后在边境线上的天然溶洞里喝一杯咖啡。"
    photos:
