  - day: 5
    city:
      en: "Weizhou Island"
      zh: "涠洲岛"
    stay:
      en: "Cliffside above the sea"
      zh: "悬崖上的海景房"
    stayKind: "hotel"
    blurb:
      en: "A century-old Catholic church built from the island's own coral stone; beside it, Bailing House, nearly two hundred years old, with wood-fired bread from the courtyard. Shiluokou bay is named for the spiral of its shoreline — snorkel and the tropical fish are right there."
      zh: "百年天主教堂，用岛上特有的珊瑚石垒砌而成；旁边的百龄楼有近两百年历史，院子里柴窑烤的面包松软可口。石螺口因海湾形似螺口得名，浮潜就能看见热带鱼群。"
    photos:
      - "destinations/catba.jpg"
      - "destinations/halong-natgeo.jpg"
