# 线路定价 · 三层架构（产品库 → 按日一行 → 人数验算）
# 真源：Notion 产品库 +「报价·按日一行」→ npm run content:notion → 本文件 → 网站。
# 同步后写入「报价·人数验算」2/4/6/8/10 人单价与全成人总价。
# 无按日明细则不估算（询价）。status: none / demo / confirmed；anchors 不展示给客人

