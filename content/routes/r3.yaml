# ── 内容与代码解耦示例 ──
# 改完本文件 → 提交到 main → GitHub Actions 自动构建部署，约 1 分钟生效。
# 不需要改任何 .tsx / .ts 代码。
#
# 填写规则：
#   1. en / zh 成对填写；某门留空会自动回退到代码里的默认值，页面不会塌。
#   2. included / excluded 只填 id，不要写中文（文案由代码统一维护）。
