feature:
  en: This is a legendary loop originating from Nanning, crafted for travelers with limited time but an uncompromising desire for depth. Over 10 days, immerse yourself in a culturally dense borderlands odyssey.Your journey begins at the thunderous Detian Waterfall, where the mist of the China-Vietnam border sweeps across your face. Next, set sail around Cat Ba Island to catch the sunset melting into the wild waves, letting the sea breeze wash away the city’s noise. Then, dive straight into the vibrant energy of Hanoi’s Old Quarter, sipping authentic drip coffee amid colonial architecture and the roar of motorbikes.Heading back, we unlock the hidden world of Longzhou’s Tianqin Zhuang Village. Finally, pedal through a boundless sea of green sugarcane fields, where the breeze carries the sweet scent of the earth.
  zh: 这是一条以南宁为原点的传奇闭环，专为时间紧凑、但对旅行深度绝不妥协的旅人而设计。在这里，10天不只是一段时间，而是一场文化密度极高的边境漫游。入境，您将站在德天瀑布前，感受中越边境水雾扑面而来的磅礴震撼；转而扬帆，去吉婆岛捕捉落入野生海浪中的落日，让海风吹散城市的喧嚣；再一头扎进河内老街，在法式建筑与机车轰鸣的烟火气里，品一口地道的滴漏咖啡。归途折返，我们在龙州天琴壮寨为您推开隐世的大门。骑行穿梭在无边无际的绿色甘蔗海中，风里都带着泥土的甜香。这不仅是一段目不暇接的精彩行程，更是一次精神的深度隐遁。
