name:
  en: The Southern Loop
  zh: 南疆回环
tagline:
  en: A slow cultural circuit through sugarcane fields, rice terraces and French-era streets
  zh: 穿行于蔗海、梯田与法式老街的慢节奏人文巡游
regions:
  en: Nanning · Chongzuo · Vietnam · Longzhou · Nanning
  zh: 南宁 · 崇左 · 越南 · 龙州 · 南宁
feature:
  en: A closed loop from Nanning, built for travellers with limited time and zero compromise on depth. Detian Falls, Cat Ba's sea air, Hanoi's old-quarter energy, then back through Longzhou for Zhuang music and sugarcane-field cycling. Ten days, one seamless re-entry, maximum cultural density.
  zh: 这是一条以南宁为原点的传奇闭环，专为时间紧凑、但对旅行深度绝不妥协的旅人而设计。在这里，10天不只是一段时间，而是一场文化密度极高的边境漫游。入境，您将站在德天瀑布前，感受中越边境水雾扑面而来的磅礴震撼；转而扬帆，去吉婆岛捕捉落入野生海浪中的落日，让海风吹散城市的喧嚣；再一头扎进河内老街，在法式建筑与机车轰鸣的烟火气里，品一口地道的滴漏咖啡。归途折返，我们在龙州天琴壮寨为您推开隐世的大门。在干栏式吊脚楼下，听百岁老人拨弄古老的壮族天琴，空灵的琴声穿越山谷；随后，骑行穿梭在无边无际的绿色甘蔗海中，风里都带着泥土的甜香。这不仅是一段目不暇接的精彩行程，更是一次精神的深度隐遁。
