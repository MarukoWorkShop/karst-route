feature:
  en: This is an epic cross-border journey that transcends boundaries and soaring altitudes. Over 14 days, you will watch the world shift seamlessly from the sultry, humid sea to the crisp, high reaches of the plateau.The adventure opens with two unhurried nights in Ha Long Bay, sailing deep into a labyrinth of towering limestone karsts before a ferry sweeps you away to the rugged shores of Cat Ba Island. As twilight falls, a vintage century-old train carries you along the historic metre-gauge railway from Hai Phong into the bustling, vibrant energy of Hanoi’s Old Quarter.In mist-shrouded Sapa, time is yours to luxury. Ascend Fansipan—the Roof of Indochina—to stand above a sea of rolling clouds in the morning, then drift through Cat Cat Village in the afternoon to immerse yourself in the ancient rhythms of Black Hmong culture.Crossing the border at Hekou, the heavy humidity gives way to a crisp breeze as you enter Yunnan. Here, explore the storied heritage of Jianshui Ancient Town, followed by the solitary peaks and vast lotus waters of Puzhehei.Ocean vastness, mountain mist, and plateau purity—all seamlessly woven into an effortless, once-in-a-lifetime overland odyssey.
  zh: 这是一条跨越国境、跨越海拔的史诗级「穿越」长线。14 天的时光，我们将带您见证情绪从湿热的海洋，一步步走向高远的高原。旅程在下龙湾拉开序幕，留白两晚，乘上一艘优雅的游船真正驶入巨石林立的海中央；随后搭乘轮渡隐入吉婆岛，吹一吹狂劲的野生海风。当傍晚来临，一列复古的百年米轨火车将载着您，从海防缓缓驶入河内老街的百年烟火里。在云雾缭绕的沙坝，留足整整一天的奢侈时间：上午登顶印度支那之巅——番西邦峰，俯瞰滚滚云海；下午慢步踱进猫猫村，在梯田与黑苗村落的古老呼吸中沉淀。越过河口国境线，风吹过，燥热退去。我们正式进入云南建水的古城墨香与普者黑孤峰之下的万亩荷塘。海的辽阔、山的雾气、高原的纯净，一次旅程都能体会得到。
