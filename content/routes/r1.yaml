feature:
  en: An epic traverse. Two nights on Ha Long Bay, a slow ferry to Cat Ba, then the century-old metre-gauge from Hai Phong into Hanoi. Sapa’s terraces get a full day — Fansipan in the morning, Cat Cat in the afternoon — before the Hekou crossing into Yunnan’s old towns. The arc is coastal and vivid first, then highland and still.
  zh: 这是一条跨越国境、跨越海拔的史诗级「穿越」长线。14 天的时光，我们将带您见证情绪从湿热的海洋，一步步走向高远的高原。旅程在下龙湾拉开序幕，留白两晚，乘上一艘优雅的游船真正驶入巨石林立的海中央；随后搭乘轮渡隐入吉婆岛，吹一吹狂劲的野生海风。当傍晚来临，一列复古的百年米轨火车将载着您，从海防缓缓驶入河内老街的百年烟火里。在云雾缭绕的沙坝（Sapa），我们给足整整一天的奢侈时间：上午登顶印度支那之巅——番西邦峰，俯瞰滚滚云海；下午慢步踱进猫猫村，在梯田与黑苗村落的古老呼吸中沉淀。越过河口国境线，风吹过，燥热退去。我们正式进入云南建水的古城墨香与普者黑孤峰之下的万亩荷塘。海的辽阔、山的雾气、高原的纯净，在这条无缝自洽的闭环里，织造出您一生一次的跨境传奇。
