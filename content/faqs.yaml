# 常见问题 FAQ
# 按分组编辑。改 id 时请同步页面锚点

src: zh
groups:
  - id: comfort
    label:
      en: Food
      zh: 餐饮、卫生与常识
    items:
      - id: faq-safety
        q:
          en: Is China safe for solo female travelers and late-night walking?
          zh: 女性独自旅行、夜间出行安全吗？
        a:
          en: Generally speaking, China has earned a wonderful global reputation as one of the most secure destinations for international travelers, including solo women. Violent street crime is exceptionally rare, and most urban centers remain vibrant and well-lit long after sunset. However, traveling through an unfamiliar landscape always requires practical mindfulness. Because English isn't universally spoken outside major hubs and digital navigation can occasionally twist or glitch for foreign phones, wandering deep into unfamiliar, non-touristy outskirts alone at night can leave you feeling disoriented or isolated. For the most fulfilling and relaxing evening experience—whether you are hoping to explore night markets or sample late-night street food—we highly recommend joining a small guided group, sticking to major pedestrian districts, or exploring with fellow travelers. Having a local guide or a travel companion not only smooths over any sudden language barriers but allows you to dive into the rich nocturnal culture with absolute comfort and confidence.
          zh: 总体来说，在国际旅行者（包括独自出行的女性）心中，中国一直是全球最安全的目的地之一。街头暴力犯罪极为罕见，大多数城市中心入夜后依然灯火通明、人气不减。不过，在陌生的地方旅行，多少还是需要一点实际的警觉：主要城市之外英语并不通用，外国手机的导航偶尔也会出偏差或失灵，深夜独自走进游客罕至的城郊深处，难免会让人有些转向、甚至孤立无援。想要一个尽兴又放松的夜晚——无论你是想逛夜市，还是尝尝深夜街头小吃——我们都强烈建议加入小规模的向导团、待在主要的步行街区，或与旅伴结伴探索。有本地向导或旅伴在身边，不仅能随时化解语言障碍，更能让你以最从容、最安心的姿态，沉浸到这片丰富的夜色文化里。
      - id: faq-security
        q:
          en: How strict are security checks at metro stations, and what are the rules?
          zh: 地铁安检严格吗？有什么规定？
        a:
          en: Security is treated with great care to keep public transit incredibly safe for everyone. Every time you enter a subway or train station, your bags will pass through a quick X-ray scanner. To avoid any minor delays, remember not to pack small pocket knives or flammable aerosols (like spray sunscreens). Also, ensure your portable power banks are clearly labeled with their capacity specifications (under 100Wh or 20000mAh is the standard global airline limit).
          zh: 公共交通的安检很认真，这也是为了让大家出行更安心。每次进地铁站或火车站，行李都要过一次 X 光机，速度很快。想少点耽搁：别随身带小刀，也别带喷雾防晒这类易燃气压罐。另外，充电宝上要有清晰的容量标识（不超过 100Wh 或 20000mAh，这也是国际通行的航空标准）。
      - id: faq-toilets
        q:
          en: What should I expect regarding public restrooms (Squat Toilets)?
          zh: 公共厕所的情况怎么样？会遇到蹲厕吗？
        a:
          en: "You will find a blend of styles! Modern shopping malls, high-speed train stations, airports, and luxury hotels are fully equipped with standard Western-style sitting toilets. However, when exploring ancient villages or natural hiking trails, you will primarily encounter traditional squat toilets, which locals prefer for hygiene reasons. A gentle piece of advice: Public restrooms don't always stock paper, so keeping a small pack of pocket tissues and hand sanitizer in your daypack is a wonderful habit."
          zh: 两种都会有。现代化的商场、高铁站、机场和高档酒店，基本都是标准的坐式马桶；但在古村落或山野步道上，更多还是传统的蹲厕——当地人认为这样更卫生。有个小提醒：公共厕所不一定备纸，随身带一小包纸巾和免洗洗手液，会是个好习惯。
      - id: faq-water
        q:
          en: Is tap water safe to drink directly, and how do I find clean water?
          zh: 自来水可以直接喝吗？怎么找干净的饮用水？
        a:
          en: Tap water in China is not intended for direct drinking. However, staying hydrated is incredibly easy! Every reputable hotel room comes equipped with a pristine electric kettle for boiling water, along with complimentary bottled mineral water. You will also find cozy convenience stores on almost every street corner selling ice-cold or room-temperature bottled water for a very nominal fee.
          zh: 自来水不建议直接饮用。但补水这件事一点不麻烦：正规酒店的房间里都配有电热水壶，也会送免费的瓶装矿泉水；街角几乎都有便利店，冰的、常温的瓶装水都有，价格也很便宜。
  - id: timing
    label:
      en: Crowds & Smart Timing
      zh: 人流控制与时间规划
    items:
      - id: faq-duration
        q:
          en: How many days do you recommend for a beautiful, unhurried first trip?
          zh: 第一次来，安排多少天比较从容？
        a:
          en: To truly absorb the landscape without feeling rushed, a duration of 10 to 14 days is the golden window. For an epic cross-border route like the Yunnan-Guangxi-Vietnam triangle, this timeframe gives you the perfect rhythm. It balances the thrilling speeds of the high-speed rail with deep, slow-paced days spent wandering ancient towns, sipping coffee by pristine rivers, and discovering misty mountain paths.
          zh: 想把风景真正看进去又不赶，10 到 14 天是最舒服的区间。像滇—桂—越这样的跨境大环线，这个时长刚好能把节奏铺开：既有高铁飞驰的畅快，也留出大把慢日子——在古城里闲逛、在清亮的河边喝杯咖啡、或者走进雾气未散的山路。
      - id: faq-weekday
        q:
          en: Are famous tourist attractions heavily crowded on regular weekdays?
          zh: 平日里热门景点也会很挤吗？
        a:
          en: Regular weekdays offer a much more intimate and quiet experience! To ensure historical monuments and natural parks remain well-preserved, China utilizes a strict real-name advanced reservation system for almost all popular landmarks. This means ticket numbers are capped daily. Don't worry about the logistics, though — our curated roadbooks are designed to automatically lock in your entry time-slots days in advance so you can walk straight in.
          zh: 平日里会清静很多。为了保护文物和自然环境，国内绝大多数热门景点都实行实名制分时段预约，每天的门票总量是限定的。流程上的事你不用操心——我们的定制路书会提前数天把入场的时段锁定好，你到点直接进去就行。
      - id: faq-holidays
        q:
          en: When should I plan my trip to avoid the biggest national holiday crowds?
          zh: 想避开人潮，应该避开哪些时段？
        a:
          en: "To enjoy a serene and relaxed exploration, we highly recommend avoiding the two grand national holidays: Chinese New Year (usually in January or February) and Golden Week (October 1st to 7th). During these festival periods, hundreds of millions of locals travel to reunite with family, causing flights, hotels, and bullet trains to book out months in advance. Choosing the shoulder seasons guarantees you lovely weather and much quieter scenic walks."
          zh: 想走得从容，建议避开两个全国性长假：春节（通常在 1 月或 2 月）和国庆黄金周（10 月 1 日至 7 日）。这两个时段有几亿人返乡或出行，机票、酒店和高铁往往提前几个月就售罄。选在肩季出行，天气舒服，景区也安静得多。
  - id: visa
    label:
      en: Visas
      zh: 签证、政策与通关
    items:
      - id: faq-passport
        q:
          en: Do I need to carry my actual physical passport with me during day trips?
          zh: 白天出门游玩，需要随身带护照原件吗？
        a:
          en: Yes, you should always carry your original passport when going out. In China, your passport serves as your primary legal ID and is required for purchasing tickets and entering major attractions , booking bullet train tickets, checking into hotels, and occasional security checks. A digital copy or photo on your phone is usually not accepted for venue entry or transit, so keeping the physical document secure with you is highly recommended.
          zh: 是的，白天出门游玩建议随身携带护照原件。 在中国，护照是您最核心的法定身份证明。购买门票和进入主流景区、乘坐高铁/火车、办理酒店入住以及应对随机的安全检查，均必须出示护照原件。手机里的电子版或照片在景区和交通枢纽通常不被接受，因此请务必妥善保管并随身携带实体证件。
      - id: faq-hotel
        q:
          en: Can foreign passports check into any hotel or boutique guesthouse?
          zh: 持外国护照可以入住任何酒店或精品民宿吗？
        a:
          en: Recent guidelines have significantly encouraged all hotels to warmly welcome international friends. However, to ensure an absolutely seamless check-in experience and guarantee proper local registration, we always advise booking your stays through established global platforms like Trip.com or checking with our bespoke concierge service. We manually verify each property in our itineraries to ensure they are fully prepared to host you with open arms.
          zh: 近来的政策明确鼓励各类住宿接待境外旅客。不过为了让入住真正顺畅、也确保临时住宿登记办妥，我们建议通过 Trip.com 这类成熟平台预订，或交由我们的专属顾问安排。行程里的每一处住宿，我们都会逐一核实，确认它们能妥妥当当地接待你。
      - id: faq-transit
        q:
          en: How does the 240-Hour Visa-Free Transit work for international travelers?
          zh: 我没有中国签证，可以利用 240 小时过境免签政策来体验喀斯特路线吗？
        a:
          en: "It is a wonderful option if you are planning a brief stopover! China has relaxed this policy considerably: travellers from an expanding list of eligible countries (currently over 50) can now stay in designated regions for up to 10 days — 240 hours — without a visa, provided they are transiting to a third country or region (for example: London → Shanghai → Hanoi). All you need to do is show your confirmed onward ticket at the airport's special transit counter. It is a fantastic, stress-free way to sample the country's rich culture on your way to another destination."
          zh: |-
            根据 中国国家移民管理局 (NIA) 官方最新公告，中国已全面放宽优化过境免签政策，将外籍人员在华停留时间由原先的 72/144 小时统一延长至 240 小时（10天）。目前，该政策已覆盖美国、英国、加拿大、俄罗斯、澳大利亚等 55 个国家，旅客可从全国 24 个省（区、市）的 60 个对外开放口岸中任一口岸免签入境。只需满足以下 4 个条件即可说走就走：
            1. 目的地不走回头路（核心规则）：行程必须是从 A国/地区 → 中国大陆（停留少于240小时） → B国/地区。例如：伦敦 → 上海→ 东京，或者 纽约 → 广州 → 香港 均可完美闭环。
            2. 准备好联程机票：在入境口岸的专用过境柜台，必须出示已确定日期及座位、前往第三国或地区的联程机票。
            3. 证件有效期合规：持有有效期不少于 3 个月的本人有效普通护照。
            4. 活动区域对齐：免签入境后，可在官方准许的省份及联动经济圈内自由通行，完美覆盖我们的路线。      有闲贴心提示：240 小时的时间自您入境次日的零时起算。我们将为您全程出具符合出入境边检审查的全英文酒店行程确认单与安全保单，为您和家人的通关全程护航。出行前，您可以通过 国家移民管理局政务服务平台 实时核对您所在国家的最新免签资质与 60 个开放口岸列表。
  - id: transport
    label:
      en: Getting Around & Navigation
      zh: 交通出行与导航
    items:
      - id: faq-maps
        q:
          en: Does Google Maps provide accurate routing and schedules in China?
          zh: 谷歌地图在中国导航准吗？
        a:
          en: |-
            No, Google Maps is not reliable for navigation in mainland China.  Because Google services are restricted in China, the app requires a VPN to load, and its transit, restaurant, and road data are heavily outdated.

            To ensure your journey is smooth and stress-free, we recommend the following alternatives:

            Apple Maps (苹果地图): If you use an iPhone, this is the best and easiest option for foreign travelers. It uses highly accurate local data from AutoNavi (Gaode) without needing a VPN, and it is fully available in English.

            Baidu Maps or Gaode Maps (百度地图 / 高德地图): These are the absolute gold standards for navigation in China, offering real-time traffic and precise lane-by-lane guidance. However, their interfaces are primarily in Chinese.
          zh: |-
            不准确，谷歌地图在中国大陆不推荐用于导航。由于谷歌服务在中国受限，该应用需要连接VPN才能加载，且其公共交通、餐厅和道路数据严重滞后。

            为了确保您的旅程顺畅无忧，我们建议您使用以下替代方案：

            Apple Maps (苹果地图):如果您使用的是 iPhone，这是对外国游客最好、最方便的选择。它采用了高德地图的精准本土数据，无需 VPN，且提供完整的英文界面。

            Baidu Maps or Gaode Maps (百度地图 / 高德地图)这是中国本土最精准的导航双雄，提供实时路况和精确的车道级导航。不过，它们的操作界面主要为中文。
      - id: faq-taxi
        q:
          en: How do I hail a taxi safely if I can't speak the language?
          zh: 语言不通，怎么安全打车？
        a:
          en: You never have to worry about waving down a cab on the street or dealing with language confusion. Right inside your Alipay app, you will find "DiDi" — China's premier ride-hailing service (similar to Uber). The entire interface is in English, you can type your destination in English, and it features a built-in real-time translation chat so you can easily message your driver. Best of all, payments are automatically processed online through your linked card, so you can just step out when you arrive.
          zh: 完全不必在路边招手、也不必跟司机比划。支付宝里就有「滴滴」——中国的网约车平台（类似 Uber）。界面是英文的，目的地可以直接用英文输入，还内置实时翻译，能和司机顺畅沟通。车费从绑定的卡里自动扣，到站直接下车走人。
      - id: faq-train
        q:
          en: Is it easy for foreign tourists to navigate and ride the High-Speed Trains?
          zh: 外国游客搭乘高铁方便吗？
        a:
          en: Absolutely! China's high-speed rail network is world-class, pristine, and incredibly efficient. Booking is effortless through English platforms like Trip.com using your passport details. The best part? China has gone completely paperless. You do not need to queue up to collect physical tickets anymore. When you arrive at the station, simply walk through the designated manual gate or automated passport reader, present your physical passport, and you are ready to board!
          zh: 非常方便。中国的高铁网是世界级的——干净、准点、效率极高。用护照信息在 Trip.com 这类英文平台就能轻松订票。还有个好消息：现在已经全面电子客票，不用排队取纸质票了。到站后走人工通道或自助验护照的闸机，递上护照即可上车。
  - id: digital
    label:
      en: Digital Connectivity & Apps
      zh: 网络、应用与沟通
    items:
      - id: faq-apps
        q:
          en: What essential applications should I install on my phone before landing?
          zh: 落地前，手机上该装好哪些应用？
        a:
          en: 'To make your trip feel incredibly smooth and effortless, we suggest downloading the "Big Four" travel bundle: Alipay & WeChat for all your daily shopping, dining, and coffee runs; Trip.com, the ultimate lifesaver for managing your hotel bookings, bullet train tickets, and attraction entry passes in English; Apple Maps or Metro apps for flawless navigation; and a translation app as your digital companion for warm daily conversations.'
          zh: 想让整趟旅程顺顺当当，建议先装好「四件套」：支付宝和微信（日常购物、吃饭、买咖啡都靠它们）；Trip.com（英文界面搞定酒店、高铁票和景区门票，非常好用）；苹果地图或地铁类 App（导航不迷路）；再一个翻译 App，日常沟通就都有了着落。
      - id: faq-language
        q:
          en: How can I communicate if I do not speak or read any Chinese?
          zh: 完全不懂中文，沟通怎么办？
        a:
          en: While English is widely understood by staff at international hotels, high-speed train stations, and younger generations in major cities, you might run into language gaps with local cab drivers or market vendors. We warmly recommend downloading a translation app with live voice-to-voice translation and camera scanning features. Simply pointing your camera at a traditional menu or a street sign will instantly translate it, turning a potential barrier into a fun, interactive part of your journey!
          zh: 国际酒店、高铁站和大城市的年轻人，英语基本都通；但碰到本地司机或菜市场的摊主，偶尔还是会卡住。建议装一个带实时语音对话和拍照翻译的 App——把镜头对准菜单或路牌，意思立刻就出来了。原本的障碍，反而会变成旅途中挺好玩的一件事。
      - id: faq-esim
        q:
          en: "eSIM vs. Local Physical SIM Card: Which option is better for my trip?"
          zh: eSIM 和当地实体卡，哪个更适合我的行程？
        a:
          en: It really depends on how you plan to travel. For a short vacation, an eSIM or international roaming is highly recommended—it works the moment you land, keeping your WhatsApp and social media instantly online. However, if you plan to stay longer, want to order food delivery, or need to register for local apps that require SMS verification, it is better to get a local physical SIM card at the airport arrivals hall, which gives you a local phone number and plenty of data at a very affordable price.
          zh: 看你怎么玩。 如果是短期度假，更推荐使用 eSIM 或国际漫游——落地就能直接使用，您的 WhatsApp 和常用社交软件也能立刻在线。但如果您打算在中国停留较长时间、想要点外卖，或者需要注册一些必须接收短信验证码的本土 App，那么在机场到达大厅办一张本地实体 SIM 卡会更合适，有个中国本土号码并包含大量流量，价格也相当实惠。
      - id: faq-firewall
        q:
          en: Will my standard social media, Google Maps, and Gmail work in China?
          zh: 我常用的社交软件、谷歌地图和 Gmail 在中国能用吗？
        a:
          en: If you use your home country's international roaming plan or an international eSIM, your social media, Google Maps, and Gmail will work normally in China. This is because international roaming traffic is routed directly through your home network, seamlessly resolving any connectivity issues. However, if you switch to a local Chinese SIM card or connect to local hotel Wi-Fi, these specific services may not load properly; in that case, we highly recommend trying local alternatives like WeChat for messaging and Apple Maps or Baidu Maps for navigation to ensure a smooth trip.
          zh: 如果您在华期间使用本国运营商的国际漫游套餐或购买国际 eSIM 数据卡，您常用的社交软件、谷歌地图和 Gmail 都是可以正常使用的。 这是因为国际漫游流量会直接通过您母国的网络进行传输，能够无缝解决网络连接问题。不过需要注意的是，如果您在当地换成了中国本土的 SIM 卡，或是直接连接酒店的本地 Wi-Fi，这些境外应用可能无法顺畅加载；届时我们非常建议您尝试使用微信（WeChat）进行日常沟通，或使用苹果地图、百度地图进行导航，以确保旅程顺畅。
  - id: money
    label:
      en: Payment & Money
      zh: 支付与货币
    items:
      - id: faq-tipping
        q:
          en: Is tipping customary or expected in restaurants and taxis?
          zh: 在餐厅和出租车上需要给小费吗？
        a:
          en: No, tipping is not required or expected in mainland China, whether in restaurants or taxis. Unlike in some Western countries, service charges are already built into the total bill, and leaving extra cash might actually confuse the staff or prompt them to chase after you to return it. For taxis, simply pay the exact fare shown on the meter or the app; for fine dining or high-end hotels, a 10% to 15% service charge may be automatically added to your bill, so no additional tip is necessary.
          zh: 不需要，在中国大陆的餐厅和出租车上都不需要给小费。 与一些西方国家不同，中国没有小费文化，所有的服务费已包含在总账单中。如果您主动留下现金，服务员可能会感到困惑，甚至会追上来把钱退还给您。乘坐出租车时，只需支付计价器或软件显示的实际金额即可；在部分高端餐厅或豪华酒店，账单中可能会自动包含10%至15%的服务费，因此无需再额外支付小费。
      - id: faq-alipay
        q:
          en: How can I set up Alipay or WeChat Pay without a Chinese bank account?
          zh: 没有中国银行卡，怎么开通支付宝或微信支付？
        a:
          en: Don't worry, the process is incredibly straightforward nowadays! Without a Chinese bank card, you can easily activate Alipay and WeChat Pay by linking your international credit or debit card (Visa, Mastercard, Discover, JCB, or Diners Club). Simply download the global version of Alipay or WeChat from your app store, register with your overseas mobile phone number, upload a photo of your passport for instant identity verification, and add your foreign card details under the "Bank Cards" section. Transactions under 200 RMB are completely free of service charges, while a 3% fee applies to single transactions over 200 RMB. This allows you to effortlessly scan QR codes to pay for restaurants, shopping, taxis, and attractions just like a local.
          zh: 放心，没有中国银行卡，您也可以通过直接绑定境外国际信用卡或借记卡（支持 Visa、Mastercard、Discover、JCB、Diners Club）来开通支付宝和微信支付。 您只需在应用商店下载国际版的 Alipay（支付宝） 或 WeChat（微信），使用您的境外手机号注册账户，上传护照照片进行身份实名认证，随后在“银行卡”页面添加您的境外卡信息即可。目前，单笔消费在 200元人民币 以下完全免收手续费，超过200元的单笔消费才会收取3%的服务费。开通后，您便可以像当地人一样，轻松通过扫码支付来搞定餐厅、购物、打车和景区门票等各类日常消费
      - id: faq-cards
        q:
          en: Can I use my foreign credit cards (Visa/Mastercard) or cash in China?
          zh: 在中国可以用境外信用卡（Visa / Mastercard）或现金吗？
        a:
          en: While cash is legally accepted everywhere, China has practically transitioned into a cashless, mobile-first society. Many small vendors, street food stalls, and taxis simply do not carry physical change anymore. Standard international plastic cards (Visa/Mastercard/Amex) are generally welcome at luxury hotels and high-end restaurants, but will not work at local scenic spots or boutiques. To travel with absolute peace of mind, we highly recommend setting up mobile payments before you arrive.
          zh: 现金在法律上当然能花，但今天的中国早已是「一部手机走天下」的社会——小摊贩、街边小吃和出租车，很多时候真的找不开零钱。国际信用卡（Visa、Mastercard、Amex）在高端酒店和讲究的餐厅基本都收，但到了本地景区、小店铺就刷不了了。想全程省心，建议出发前先把手机支付开通好。
