  - id: hp-climb
    category: hike
    flag: ✦
    name: Guest F
    country: ""
    rating: 5
    date: 2025-01-16
    body:
      zh: 我们年纪不小了，没想到还能在阳朔的岩壁上走一遭。攀岩不是年轻人的专利。缆绳在手里的时候，觉得这条路是写给我们的。
      en: We’re not young anymore, and still didn’t expect to climb Yangshuo rock. Climbing isn’t only for the young. With the rope in our hands, it felt like this route was written for us.
