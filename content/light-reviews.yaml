    body:
      zh: 没有一顿好吃的解决不了的事。市场里蹲下来看干货、伸手碰活鱼，再到灶边自己翻炒。一顿不够，那就再来一顿。
      en: There’s almost nothing a good meal can’t fix. We crouched over dried goods at the market, touched live fish, then stir-fried at the stove ourselves. One meal wasn’t enough — so we had another.
