    flag: ✦
    name: Guest B
    country: ""
    rating: 5
    date: 2025-04-02
    body:
      zh: 在阳朔的灶台前，不同国家的人围在一起。大人交到了朋友，孩子也有了玩伴。希望两代人的故事，以后还能接着写。
      en: Around a Yangshuo stove, people from different countries stood together. The adults made friends; the kids found playmates. We hope both generations get to write the next chapter.
