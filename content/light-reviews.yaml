  - id: hp-seed-box
    category: foodfilm
    flag: ✦
    name: Guest A
    country: ""
    rating: 5
    date: 2025-03-12
    body:
      zh: 今天不只是买了一包种子，像带回家一个小小的「生命盲盒」。接下来要看着它破土、长大，有一天用自己种的香菜，做一碗地道的中国汤面。这才是最好的旅行纪念品。
      en: Today we didn’t just buy a packet of seeds — it felt like bringing home a tiny “life blind box.” Next we’ll watch it break the soil and grow, and one day cook a proper Chinese noodle soup with coriander we grew ourselves. That’s the best kind of travel souvenir.
    photos:
      - light/reviews/hp-1.jpeg
      - light/reviews/hp-2.jpeg
      - light/reviews/hp-3.jpeg

