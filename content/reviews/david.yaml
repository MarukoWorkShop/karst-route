short:
  en: We've done group tours before — this private experience is on a completely different level.
  zh: 以前走过团队游，这次私团完全是另一个层级。
full:
  en: We've done group tours before and always came home feeling we'd seen nothing properly. This was completely different — being private meant we could linger anywhere, and the guide was willing to go much deeper into every story. The Tianqin performance in Longzhou was in an actual Zhuang village, not a tourist stage. That kind of experience is priceless. Since returning to New York, I've recommended this trip to at least seven friends.
  zh: 我们以前参加过很多团队游，回来后总觉得走马观花。这次完全不同——因为是私家团，我们可以在任何一个地方多待一会儿，向导也更愿意讲深入的故事。龙州的天琴表演是在一个真实的壮族村落里看的，不是为游客特别安排的舞台。那种体验是无价的。回到纽约以后，我把这段旅行推荐给了至少七个朋友。
