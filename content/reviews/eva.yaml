full:
  en: At the cliff garden on Weizhou Island, being a guest only feels like calm seas. Then we saw the garden Asang had actually grown into life, and I was genuinely in awe. "Become an agave — hold back the storms of life." I think her greatest strength is that she never stops believing in herself. Beauty has force, and it has reached so many more people.
  zh: 在涠洲岛的悬崖花园，作为客人只感受到风平浪静的时候，但当我们看到了阿桑种活的一座花园，真是非常佩服。”成为一颗龙舌兰，挡住人生的风浪“，我觉得她最强大的地方，在于永远相信自己，美好有力量，感染到了更多的人。
