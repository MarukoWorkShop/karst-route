  - id: hp-svetlana-stromatolite
    category: hike
    kind: photo
    flag: ✦
    name: Svetlana Anisimova
    country: Russia
    rating: 5
    date: 2026-10-14
    body:
      zh: 桂林拥有世界级喀斯特地貌资源，俄罗斯地质学家阿莫西诺娃Я Svetlana Anisimova 在阳朔的桂花古道，阳朔最佳看日出地方——云涧院子，及阳朔“千里江山图”等地研究3.7亿年前的叠层石
      en: "Guilin holds world-class karst landforms. Russian geologist Svetlana Anisimova studied 370-million-year-old stromatolites at Yangshuo's Osmanthus Ancient Trail, at Yunjian Courtyard — the best place in Yangshuo to watch the sunrise — and at the Thousand Li of Rivers and Mountains scenic area."
