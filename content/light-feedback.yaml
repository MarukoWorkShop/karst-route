  - id: hp-bike-stay
    category: hike
    kind: note
    flag: ✦
    name: Guest G
    country: ""
    rating: 5
    date: 2024-10-09
    body:
      zh: 我们非常喜欢这次安排的住宿。位置非常理想——就在河边，远离主要旅游区的喧嚣，因此感觉极其宁静，同时又离一切都很近，田园诗般优美，毫不夸张地说，这里确实像一个小天堂。环境欢迎我们的到来。服务非常出色。这里也是探索该地区的绝佳基地。附近有一些活动非常出色。这是一个很棒的额外惊喜。我们特别欣赏的一点是免费的洗衣机和烘干机。这带来很大不同。美丽的地理位置、出色的员工和非常放松的氛围，我们一定会再次来。我们还租了自行车，沿着乡道慢慢骑，竹林和田埂就在旁边；骑累了就回住处歇一歇，把衣服洗干净，第二天又能接着出发。
      en: We loved the lodging on this trip. The location is ideal — right by the river, away from the main tourist noise, so it feels deeply quiet, yet close to everything; pastoral and, without exaggeration, a little paradise. The place welcomed us. Service was excellent. It’s also a great base for exploring the area. Some nearby activities were outstanding — a wonderful extra surprise. We especially appreciated the free washer and dryer; that made a real difference. Beautiful setting, wonderful staff, and a very relaxed atmosphere — we will definitely come back. We also rented bikes and rode slowly along country lanes, with bamboo and rice paddies beside us; when we tired, we returned to rest, washed our clothes, and were ready to set out again the next day.
    photos:
      - light/reviews/hp-15.jpeg
      - light/reviews/hp-16.jpeg

