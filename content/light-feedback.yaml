  - id: hp-martin-li-river
    category: hike
    kind: note
    flag: ✦
    name: Martin
    country: Germany
    rating: 5
    date: 2026-10-14
    body:
      zh: 我们一家人走了漓江的桂花古道，乘坐竹筏游漓江，到阳朔大面山，“漓江第一湾” 周边山上徒步，在导游的讲解下，我们充分了解漓江喀斯特地貌的前世今生。非常难忘的体验
      en: "Our family walked the Osmanthus Ancient Trail along the Li River, took a bamboo raft on the Li River, and hiked the hills around Damianshan in Yangshuo, near the First Bend of the Li River. With our guide's explanation, we came to understand the past and present of the Li River's karst landscape. An unforgettable experience."
    photos:
      - feedback/martin-raft-pier.jpg
      - feedback/martin-group-pier.jpg
      - feedback/martin-river-bend.jpg
      - feedback/martin-stone-steps.jpg

