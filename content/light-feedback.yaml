    country: ""
    rating: 5
    date: 2025-06-03
    body:
      zh: 向导带我们看见稻田里生活的两个民族，壮族和瑶族。红瑶阿嫂把长发举过头顶，那一刻真的很打动人。
      en: Our guide showed us two peoples living among the rice terraces — Zhuang and Yao. When a Red Yao aunt lifted her long hair above her head, that moment truly moved us.
