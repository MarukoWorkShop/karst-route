# 轻体验真实反馈（详情卡右侧）
# 修改方式二选一：
#   1. Notion「轻体验评价」表 → npm run content:notion 同步回本文件
#   2. 直接改本文件
# category 只能是 hike / photo / village / foodfilm / craft / wellness
# kind 二选一：
#   photo  照片 + 一句话描述。photos 1–5 张；body 只写那一句话
#   note   客人留言。body 写留言；photos 可空，有图也可以附上
# body 中英各不超过 999 字；photos 写 light/reviews/…（与 COS 同键）
# 原文语言见 src；译文空着时上线前再补

src: zh
items:
  - id: hp-seed-box
    category: foodfilm
    kind: note
    flag: ✦
    name: Guest A
    country: ""
    rating: 5
    date: 2025-03-12
    body:
      zh: 今天不只是买了一包种子，像带回家一个小小的「生命盲盒」。接下来要看着它破土、长大，有一天用自己种的香菜，做一碗地道的中国汤面。这才是最好的旅行纪念品。
      en: Today we didn’t just buy a packet of seeds — it felt like bringing home a tiny “life blind box.” Next we’ll watch it break the soil and grow, and one day cook a proper Chinese noodle soup with coriander we grew ourselves. That’s the best kind of travel souvenir.
    photos:
      - light/reviews/hp-1.jpeg
      - light/reviews/hp-2.jpeg
      - light/reviews/hp-3.jpeg

  - id: hp-kitchen-friends
    category: foodfilm
    kind: note
    flag: ✦
    name: Guest B
    country: ""
    rating: 5
    date: 2025-04-02
    body:
      zh: 在阳朔的灶台前，不同国家的人围在一起。大人交到了朋友，孩子也有了玩伴。希望两代人的故事，以后还能接着写。
      en: Around a Yangshuo stove, people from different countries stood together. The adults made friends; the kids found playmates. We hope both generations get to write the next chapter.
