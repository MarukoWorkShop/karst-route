# 轻旅行体验 · 小产品栏目（首页「让旅途真正改变你」区块的六张卡 + 详情大卡）
# 修改方式二选一：
#   1. Notion「轻体验栏目」表 → npm run content:notion 同步回本文件
#   2. 直接在 GitHub 改本文件
# 两边谁的时间戳新，谁生效。改完需要重新构建才会上线。
#
# 字段 ↔ 网站位置：
#   badge      卡片右上角小标签 / 详情大卡顶部（中英同一串英文即可）
#   title      卡片主标题 / 详情大卡标题
#   tagline    卡片副标题 / 详情大卡标题下一行
#   duration / group / season   详情大卡里的三格参数
#   cover      卡片封面图（public/ 下的相对路径）
#   gallery    详情大卡图片：第一张为主图，后两张为小图
#   desc       详情正文，两段
#   highlights 「体验内容」列表
#   included   「费用包含」标签
#
# 注意：
#   - id 只能用 hike / photo / village / foodfilm / craft / wellness，不要改
#   - 图片路径只写 public/ 下相对路径，例如 light/hike/hike-1.jpeg
#   - 可售小产品（SKU）在旁边的独立表「轻体验清单」→ content/light-skus.yaml
#   - 本文件是栏目级介绍；单价与小产品不写在这里

src: zh
items:
  - id: hike
    badge: HIKING & CYCLING
    title:
      en: Hiking & Cycling
      zh: 徒步 · 骑行活动
    tagline:
      en: Half-day to full-day routes on foot or two wheels
      zh: 半日到一日的徒步与骑行线路
    duration:
      en: Half day – full day
      zh: 半日 – 一日
    group:
      en: 2–8 travellers
      zh: 2–8 人小团
    season:
      en: Year-round
      zh: 全年可订
    cover: light/hike/hike-1.jpeg
    gallery:
      - light/hike/hike-1.jpeg
      - light/hike/scooter-1.jpeg
      - light/hike/raft-1.jpeg
    desc:
      - en: Karst valleys, bamboo shade and river paths — we match the outing to your legs and the weather, then go out with a guide who knows which bend is worth the climb and which stretch stays cool.
        zh: 喀斯特山谷、竹荫乡道、沿河小径——我们按体力和当天天气选线，再由熟悉路况的向导带路：哪段值得爬、哪段更凉快，他们心里有数。
      - en: Every outing is paced, not punished. Safety briefing, gear and a proper meal are arranged in advance. You bring shoes you trust.
        zh: 每一次出行都讲究节奏，不比拼强度。安全说明、装备与正餐提前安排。你只需要带一双自己信得过的鞋。
    highlights:
      - en: Countryside walks above glass fields and karst viewpoints
        zh: 玻璃田与喀斯特观景台的田园徒步
      - en: Guided creek tracing with swim pools and natural slides
        zh: 教练带领的山谷溯溪：碧潭与天然水滑
      - en: Vintage scooters along the Yulong River promenade
        zh: 遇龙河网红步道复古机车骑行
      - en: ATV off-road through streams and valley tracks
        zh: 全地形车山谷冲滩越野
    included:
      - en: Local guide / coach throughout
        zh: 全程在地向导 / 户外教练
      - en: Activity gear as listed (helmet, life jacket, vehicle)
        zh: 活动所列装备（头盔、救生衣、车辆等）
      - en: Drinking water and one main meal when stated
        zh: 饮用水；行程写明时含一顿正餐
  - id: photo
    badge: PHOTO WALKS
    title:
      en: Professional Photo Walks
      zh: 专业旅拍
    tagline:
      en: A photographer-guide, not a photographer-tour
      zh: 跟着摄影师走，而不是被摄影师拍
    duration:
      en: 2–4 hours
      zh: 2–4 小时
    group:
      en: 1–6 travellers
      zh: 1–6 人
    season:
      en: Year-round · best at golden hour
      zh: 全年可订 · 黄金光线最佳
    cover: destinations/chongzuo-rachel.jpg
    gallery:
      - destinations/chongzuo-rachel.jpg
      - destinations/weizhoudao3.jpeg
      - destinations/catba.jpg
    desc:
      - en: Our photographer-guides shoot the region every week, so they know which lane catches the light at 5pm and which pier is empty before 7am. They take the pictures and they teach you to see the same frame.
        zh: 我们的摄影向导每周都在这一带拍摄，知道哪条巷子五点有光、哪个码头七点前没人。他们既替你拍，也教你怎么看这个画面。
      - en: You get a same-day preview and a full edited set afterwards — no watermark, no upsell, yours to print.
        zh: 当天给预览，随后交付整套精修：无水印、无二次推销，版权归你，可直接打印。
    highlights:
      - en: Golden-hour route planned around the day's light
        zh: 按当天光线规划的黄金时刻路线
      - en: Portrait set for couples
        zh: 情侣 / 亲子 / 单人皆可的人像套系
      - en: Edited photos delivered in a private gallery
        zh: 精修照片私密相册交付
      - en: Light coaching on composition
        zh: 构图指导，手机同样用得上
    included:
      - en: Photographer-guide for the session
        zh: 摄影师向导全程
      - en: Edited digital photos
        zh: 精修数字照片（可打印）
      - en: Private online gallery
        zh: 私密线上相册
  - id: village
    badge: VILLAGE STUDY
    title:
      en: Village & Heritage Study
      zh: 村落人文考察
    tagline:
      en: Half-day field visits with people who live there
      zh: 半日田野走访，由住在村里的人带路
    duration:
      en: Half day
      zh: 半日
    group:
      en: 2–10 travellers
      zh: 2–10 人
    season:
      en: Year-round
      zh: 全年可订
    cover: light/village/yao-visit-1.jpeg
    gallery:
      - light/village/yao-visit-1.jpeg
      - light/village/oil-tea-baba-1.jpeg
      - light/village/dong-song-2.jpeg
    desc:
      - en: Not a photo stop. A half day inside a working village — the well that still feeds it, the hall where decisions get made, the family that has fired the same kiln for four generations.
        zh: 不是拍照打卡点。是半个白天待在一个还在运转的村子里：仍在使用的水井、商量事情的祠堂、烧了四代人的那口窑。
      - en: Visits are hosted by residents and sized small on purpose. We brief you on what to ask, what to photograph, and what to leave alone.
        zh: 走访由村民自己接待，刻意控制人数。出发前我们会说明：可以问什么、可以拍什么、什么应当回避。
    highlights:
      - en: Old-town walk with a resident host
        zh: 由原住民带路的老城行走
      - en: Handicraft household visit (pottery
        zh: 手作人家走访（制陶 / 织布 / 造纸）
      - en: Village meal or tea with the host family
        zh: 与接待家庭共餐或饮茶
      - en: Briefing notes on local customs and etiquette
        zh: 在地习俗与礼仪行前说明
    included:
      - en: Resident host and interpreter
        zh: 村民接待与随行翻译
      - en: Visit fees shared with the households
        zh: 走访费用与村民共享
      - en: Round-trip transfer from your hotel
        zh: 酒店往返接送
  - id: foodfilm
    badge: FOOD & FILM
    title:
      en: Food & Film
      zh: 美食与电影
    tagline:
      en: Cook, taste, and see the place — from market to table
      zh: 从市场到餐桌：动手做、亲自尝，再认识这座城
    duration:
      en: Half day
      zh: 半天
    group:
      en: 1–10 travellers
      zh: 1–10 人
    season:
      en: Year-round
      zh: 全年可订
    cover: light/foodfilm/cooking-1.jpeg
    gallery:
      - light/foodfilm/cooking-1.jpeg
      - light/foodfilm/cooking-2.jpeg
    desc:
      - en: A market walk, the dishes that define a city, then a film shot in the streets you just walked — screened over dinner or in a small room with the windows open.
        zh: 先逛一趟菜市场，吃这座城市真正拿得出手的几道菜，再看一部就拍在你刚走过那些街上的电影——配着晚餐，或在一扇开着窗的小屋里放映。
      - en: "The pairing is the point: pho tastes different after you've seen the 5am broth run, and a karst skyline lands harder once you've stood under it that afternoon."
        zh: 搭配本身就是重点：看过凌晨五点熬汤的场面，河粉的味道不一样；下午亲自站在那片喀斯特天际线下，晚上银幕上的画面才落得下来。
    highlights:
      - en: Morning market walk with a food writer or chef
        zh: 由 food writer 或主厨带队的早市
      - en: Six-to-eight tastings
        zh: 6–8 处品鉴，不安排游客菜单
      - en: Film screening tied to the location
        zh: 与取景地呼应的电影放映
      - en: Evening option with drinks and open-air screen
        zh: 可选傍晚场：酒水 + 露天银幕
    included:
      - en: Food host for the whole session
        zh: 全程美食向导
      - en: All tastings and one drink
        zh: 全部品鉴与一杯饮品
      - en: Screening setup and subtitles
        zh: 放映设备与字幕
  - id: craft
    badge: HANDICRAFT
    title:
      en: Handicraft Workshops
      zh: 手作与非遗工坊
    tagline:
      en: Paint a fan, try a heritage craft, or sit with brush and ink
      zh: 画扇、非遗手作，或一堂书法——好好做完一件
    duration:
      en: 2–4 hours
      zh: 2–4 小时
    group:
      en: 1–10 travellers
      zh: 1–10 人
    season:
      en: Year-round
      zh: 全年可订
    cover: light/craft/fuli-fan-1.jpeg
    gallery:
      - light/craft/fuli-fan-1.jpeg
      - light/craft/heritage-1.jpeg
      - light/craft/calligraphy-1.jpeg
    desc:
      - en: "Two to four hours at one bench: throwing clay, dyeing cloth, pressing tea, shaping paper. The instructor is the maker, and the pace is the pace the craft actually needs."
        zh: 两到四个小时，守在一张工作台前：拉坯、扎染、压茶、抄纸。教你的人是做这行的人，节奏也是这门手艺真正需要的节奏。
      - en: You leave with the object you made — fired, dried or boxed for shipping. Nothing is a demo piece someone else finished for you.
        zh: 你带走的是自己做的那件：烧好、晾干或打包寄回。没有哪一件是别人替你收尾的样品。
    highlights:
      - en: Pottery on the wheel at a working kiln
        zh: 在仍在烧窑的作坊里拉坯
      - en: Indigo dyeing and natural pigment mixing
        zh: 蓝靛扎染与植物染料调制
      - en: Tea pressing
        zh: 压茶、焙火与品鉴
      - en: Take home what you made
        zh: 作品带走，可安排寄送
    included:
      - en: Maker-led instruction
        zh: 手艺人全程教学
      - en: All materials
        zh: 全部材料、烧制与包装
      - en: Shipping to your home address
        zh: 成品寄送到家
  - id: wellness
    badge: WELLNESS & SPA
    title:
      en: Healing & Unwinding
      zh: 疗愈与放松
    tagline:
      en: Tai chi, nature stillness, and traditional massage — slow hours in the karst
      zh: 太极、山水静心与传统按摩——在桂林慢下来的几个小时
    duration:
      en: 1–3 hours
      zh: 1–3 小时
    group:
      en: 1–10 travellers
      zh: 1–10 人
    season:
      en: Year-round
      zh: 全年可订
    cover: light/wellness/taichi-2.jpeg
    gallery:
      - light/wellness/taichi-2.jpeg
      - light/wellness/taichi-1.jpeg
    desc:
      - en: From the opening form to cloud hands, each breath folds the landscape back into the body. We teach beginner-friendly tai chi outdoors — bilingual coaching, zero jargon — so travellers can feel soft power and stillness between the peaks.
        zh: 从起势到云手，再由发力至收势，在一呼一吸之间，将天地灵气融归丹田；每一式抬手落步，皆可成为旅途中最独特、不可复制的记忆。我们为零基础学员开设太极课，中英双语、耐心拆解，在山水里真正放松身心。
      - en: Pair it with a quiet yoga or breath session above the river, or end a long countryside day with a traditional Chinese foot or full-body massage — herbal oils, no upsell, book a day ahead.
        zh: 也可以在我们安排的临水处做瑜伽与深呼吸，与桂林山水安静相处；或在乡间走完漫长一天后，预约传统足底 / 全身按摩——温热与穴位并用，提前一天预订即可。
    highlights:
      - en: "Tai chi class · ¥300 / person (1–3) · ¥200 / person (4–10)"
        zh: 太极拳体验 · 1–3 人 300 元/人 · 4–10 人 200 元/人
      - en: Nature yoga & breathwork among the karst peaks
        zh: 自然体验 · 瑜伽与深呼吸，与山水相处
      - en: "Foot / full-body massage · oil 1.5h or dry 1h · foot bath & shoulders"
        zh: 足底或全身按摩 · 精油 1.5 小时 / 无油 1 小时 · 足浴与肩部按摩
      - en: Beginner-friendly · bilingual coaching · book massage one day ahead
        zh: 零基础友好 · 中英双语教学 · 按摩请至少提前一天预订
    included:
      - en: Coach or therapist for the session
        zh: 教练或按摩师全程
      - en: Outdoor venue or quiet treatment room as listed
        zh: 户外场地或安静理疗空间（按项目）
      - en: Massage oils / towels when booked
        zh: 按摩精油、毛巾（预约按摩时）
